name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://digitstudio.design
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      RESEND_API_KEY: re_dummy_ci_key
      CONTACT_TO_EMAIL: inbox@digitstudio.design
      CONTACT_FROM_EMAIL: Digit Studio <hello@digitstudio.design>
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint check
        run: npm run lint

      - name: Build Next.js
        run: npm run build:next

      - name: Build Cloudflare OpenNext bundle
        run: npm run build:cf
