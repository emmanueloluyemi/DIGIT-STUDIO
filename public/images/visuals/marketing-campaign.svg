<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="mktBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="50%" stop-color="#141112"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="cardGradMkt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D1718"/>
      <stop offset="100%" stop-color="#110E0F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#mktBg)"/>

  <!-- Fine dot grid -->
  <g fill="#F5F2ED" fill-opacity="0.06">
    <circle cx="200" cy="200" r="1.5"/><circle cx="400" cy="200" r="1.5"/><circle cx="600" cy="200" r="1.5"/><circle cx="800" cy="200" r="1.5"/><circle cx="1000" cy="200" r="1.5"/>
    <circle cx="200" cy="400" r="1.5"/><circle cx="400" cy="400" r="1.5"/><circle cx="600" cy="400" r="1.5"/><circle cx="800" cy="400" r="1.5"/><circle cx="1000" cy="400" r="1.5"/>
    <circle cx="200" cy="600" r="1.5"/><circle cx="400" cy="600" r="1.5"/><circle cx="600" cy="600" r="1.5"/><circle cx="800" cy="600" r="1.5"/><circle cx="1000" cy="600" r="1.5"/>
  </g>

  <!-- Left: Mobile Social Story Mockup Card -->
  <g transform="translate(100, 120)">
    <rect width="280" height="540" rx="28" fill="url(#cardGradMkt)" stroke="#F5F2ED" stroke-opacity="0.12" stroke-width="1.5"/>
    <!-- Top Camera Notch -->
    <rect x="95" y="12" width="90" height="16" rx="8" fill="#0B0B0B"/>
    
    <!-- Story Segment Bar -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="72" height="3" rx="1.5" fill="#8B0D1A"/>
      <rect x="80" y="0" width="72" height="3" rx="1.5" fill="#8B0D1A"/>
      <rect x="160" y="0" width="72" height="3" rx="1.5" fill="#F5F2ED" fill-opacity="0.25"/>
    </g>

    <!-- Post Visual -->
    <rect x="20" y="60" width="240" height="300" rx="16" fill="#171213" stroke="#8B0D1A" stroke-opacity="0.3"/>
    <circle cx="140" cy="180" r="45" fill="#8B0D1A" fill-opacity="0.2" stroke="#8B0D1A" stroke-width="1.5"/>
    <text x="140" y="186" text-anchor="middle" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="20">LAUNCH</text>
    <text x="140" y="206" text-anchor="middle" fill="#D8D3CD" font-family="monospace" font-size="10">CAMPAIGN V2</text>

    <!-- Social Engagement Metrics -->
    <g transform="translate(20, 385)">
      <text x="0" y="0" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="16">Brand Narrative</text>
      <text x="0" y="22" fill="#77716E" font-family="sans-serif" font-size="12">Structured platform messaging.</text>
      
      <!-- Metrics row -->
      <g transform="translate(0, 45)">
        <rect width="112" height="50" rx="8" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.08"/>
        <text x="12" y="22" fill="#77716E" font-family="monospace" font-size="9">IMPRESSIONS</text>
        <text x="12" y="42" fill="#8B0D1A" font-family="'Syne', sans-serif" font-weight="700" font-size="16">+142%</text>

        <rect x="128" y="0" width="112" height="50" rx="8" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.08"/>
        <text x="140" y="22" fill="#77716E" font-family="monospace" font-size="9">ROAS</text>
        <text x="140" y="42" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="16">8.4X</text>
      </g>
    </g>
  </g>

  <!-- Right: Strategy Grid & Campaign Performance Dashboard -->
  <g transform="translate(420, 120)">
    <rect width="680" height="540" rx="20" fill="url(#cardGradMkt)" stroke="#F5F2ED" stroke-opacity="0.08" stroke-width="1"/>
    
    <g transform="translate(40, 45)">
      <text x="0" y="0" fill="#77716E" font-family="monospace" font-size="11" letter-spacing="3">DIGIT STUDIO · CAMPAIGN STRATEGY</text>
      <text x="0" y="32" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="24">Multi-Channel Distribution Engine</text>
      <text x="0" y="58" fill="#D8D3CD" font-family="'Instrument Serif', serif" font-style="italic" font-size="18">Transforming audience curiosity into repeatable client acquisition.</text>

      <!-- Calendar / Platform Matrix Row -->
      <g transform="translate(0, 85)">
        <rect width="185" height="130" rx="12" fill="#141112" stroke="#8B0D1A" stroke-opacity="0.4"/>
        <text x="18" y="30" fill="#8B0D1A" font-family="monospace" font-size="11" font-weight="700">01 · INSTAGRAM</text>
        <text x="18" y="55" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="600" font-size="15">Visual Proof &amp; Reels</text>
        <text x="18" y="78" fill="#77716E" font-family="sans-serif" font-size="11">High-craft aesthetic reels and founder stories.</text>
        <rect x="18" y="98" width="65" height="18" rx="9" fill="#8B0D1A" fill-opacity="0.2"/>
        <text x="28" y="111" fill="#8B0D1A" font-family="monospace" font-size="9">3X / WEEK</text>

        <rect x="205" y="0" width="185" height="130" rx="12" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.08"/>
        <text x="223" y="30" fill="#D8D3CD" font-family="monospace" font-size="11">02 · LINKEDIN</text>
        <text x="223" y="55" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="600" font-size="15">Industry Thought</text>
        <text x="223" y="78" fill="#77716E" font-family="sans-serif" font-size="11">Case studies and breakdown breakdowns.</text>
        <rect x="223" y="98" width="65" height="18" rx="9" fill="#F5F2ED" fill-opacity="0.08"/>
        <text x="233" y="111" fill="#D8D3CD" font-family="monospace" font-size="9">2X / WEEK</text>

        <rect x="410" y="0" width="185" height="130" rx="12" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.08"/>
        <text x="428" y="30" fill="#D8D3CD" font-family="monospace" font-size="11">03 · PAID ADS</text>
        <text x="428" y="55" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="600" font-size="15">Targeted Meta &amp; YT</text>
        <text x="428" y="78" fill="#77716E" font-family="sans-serif" font-size="11">Direct response motion creatives.</text>
        <rect x="428" y="98" width="65" height="18" rx="9" fill="#F5F2ED" fill-opacity="0.08"/>
        <text x="438" y="111" fill="#D8D3CD" font-family="monospace" font-size="9">DAILY RUN</text>
      </g>

      <!-- Bottom Analytics Summary -->
      <g transform="translate(0, 245)">
        <rect width="595" height="175" rx="14" fill="#130F10" stroke="#F5F2ED" stroke-opacity="0.06"/>
        <text x="24" y="34" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="600" font-size="16">Audience Growth &amp; Retention</text>
        
        <!-- Bar Graph -->
        <g transform="translate(24, 60)">
          <rect x="0" y="50" width="45" height="50" rx="4" fill="#3A3335"/>
          <text x="22" y="115" text-anchor="middle" fill="#77716E" font-family="monospace" font-size="10">W1</text>

          <rect x="75" y="35" width="45" height="65" rx="4" fill="#3A3335"/>
          <text x="97" y="115" text-anchor="middle" fill="#77716E" font-family="monospace" font-size="10">W2</text>

          <rect x="150" y="20" width="45" height="80" rx="4" fill="#670913"/>
          <text x="172" y="115" text-anchor="middle" fill="#77716E" font-family="monospace" font-size="10">W3</text>

          <rect x="225" y="0" width="45" height="100" rx="4" fill="#8B0D1A"/>
          <text x="247" y="115" text-anchor="middle" fill="#8B0D1A" font-family="monospace" font-size="10" font-weight="700">W4</text>
        </g>

        <!-- KPI Callout on right -->
        <g transform="translate(340, 50)">
          <text x="0" y="20" fill="#77716E" font-family="monospace" font-size="11">TOTAL REACH</text>
          <text x="0" y="52" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="30">840,000+</text>
          <text x="0" y="78" fill="#8B0D1A" font-family="monospace" font-size="11">● REAL CONVERSIONS</text>
        </g>
      </g>
    </g>
  </g>
</svg>
