<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="60%" stop-color="#141112"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B0D1A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B0D1A" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191516"/>
      <stop offset="100%" stop-color="#100D0E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad2)"/>

  <!-- Code Matrix Pattern -->
  <g stroke="#F5F2ED" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>

  <!-- Main Web Application Mockup Frame -->
  <g transform="translate(100, 110)">
    <!-- Browser Window Shadow -->
    <rect x="15" y="15" width="1000" height="580" rx="16" fill="#000000" opacity="0.6"/>
    <!-- Browser Window Container -->
    <rect width="1000" height="580" rx="16" fill="url(#windowGrad)" stroke="#F5F2ED" stroke-opacity="0.1" stroke-width="1"/>

    <!-- Window Top Chrome -->
    <rect width="1000" height="46" rx="16" fill="#141112"/>
    <circle cx="28" cy="23" r="5" fill="#3A3335"/>
    <circle cx="44" cy="23" r="5" fill="#3A3335"/>
    <circle cx="60" cy="23" r="5" fill="#8B0D1A"/>

    <!-- Address Bar -->
    <rect x="120" y="10" width="460" height="26" rx="6" fill="#0B0B0B" stroke="#F5F2ED" stroke-opacity="0.08"/>
    <circle cx="136" cy="23" r="3" fill="#8B0D1A"/>
    <text x="148" y="27" fill="#77716E" font-family="monospace" font-size="11">https://digitstudio.design/app/platform</text>

    <!-- Status Pill -->
    <rect x="830" y="12" width="140" height="22" rx="11" fill="#8B0D1A" fill-opacity="0.2" stroke="#8B0D1A" stroke-width="1"/>
    <circle cx="846" cy="23" r="3" fill="#8B0D1A"/>
    <text x="856" y="27" fill="#F5F2ED" font-family="monospace" font-size="10" letter-spacing="1">NEXT.js 16 READY</text>

    <!-- Interior Layout: Sidebar + Main Content -->
    <!-- Sidebar -->
    <rect x="0" y="46" width="220" height="534" fill="#120E0F" stroke="#F5F2ED" stroke-opacity="0.06"/>
    <g transform="translate(24, 75)">
      <text x="0" y="0" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="16">DIGIT STUDIO</text>
      <text x="0" y="20" fill="#77716E" font-family="monospace" font-size="10" letter-spacing="2">DIGITAL CORE</text>
      
      <!-- Nav Links -->
      <g transform="translate(0, 50)" fill="#77716E" font-family="sans-serif" font-size="13">
        <rect x="-8" y="-6" width="180" height="32" rx="6" fill="#8B0D1A" fill-opacity="0.15"/>
        <text x="14" y="15" fill="#F5F2ED" font-weight="600">Analytics &amp; KPI</text>
        <circle cx="0" cy="11" r="3" fill="#8B0D1A"/>

        <text x="14" y="55">Component Engine</text>
        <text x="14" y="95">API Gateways</text>
        <text x="14" y="135">Cloudflare Edge</text>
        <text x="14" y="175">Security &amp; Auth</text>
      </g>
    </g>

    <!-- Main Canvas Area -->
    <g transform="translate(245, 75)">
      <!-- Metric Cards Row -->
      <g transform="translate(0, 0)">
        <rect width="225" height="95" rx="12" fill="#1A1516" stroke="#F5F2ED" stroke-opacity="0.08"/>
        <text x="20" y="30" fill="#77716E" font-family="monospace" font-size="10" letter-spacing="1">ENGINE PERFORMANCE</text>
        <text x="20" y="65" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="28">99.98%</text>
        <text x="145" y="65" fill="#8B0D1A" font-family="monospace" font-size="11">TURBOPACK</text>
      </g>
      <g transform="translate(245, 0)">
        <rect width="225" height="95" rx="12" fill="#1A1516" stroke="#F5F2ED" stroke-opacity="0.08"/>
        <text x="20" y="30" fill="#77716E" font-family="monospace" font-size="10" letter-spacing="1">AVERAGE LATENCY</text>
        <text x="20" y="65" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="28">34ms</text>
        <text x="140" y="65" fill="#D8D3CD" font-family="monospace" font-size="11">EDGE TTFB</text>
      </g>
      <g transform="translate(490, 0)">
        <rect width="225" height="95" rx="12" fill="#1A1516" stroke="#8B0D1A" stroke-opacity="0.3"/>
        <text x="20" y="30" fill="#77716E" font-family="monospace" font-size="10" letter-spacing="1">INTERACTIONS</text>
        <text x="20" y="65" fill="#8B0D1A" font-family="'Syne', sans-serif" font-weight="700" font-size="28">60 FPS</text>
        <text x="145" y="65" fill="#D8D3CD" font-family="monospace" font-size="11">SMOOTH</text>
      </g>

      <!-- Large Interactive Chart Card -->
      <g transform="translate(0, 115)">
        <rect width="715" height="340" rx="12" fill="#171213" stroke="#F5F2ED" stroke-opacity="0.08"/>
        
        <text x="24" y="35" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="600" font-size="16">Platform Traffic &amp; Conversion Trajectory</text>
        <text x="24" y="55" fill="#77716E" font-family="monospace" font-size="11">Full-stack web application development tailored for real business conversion.</text>

        <!-- Chart Grid Lines -->
        <g stroke="#F5F2ED" stroke-opacity="0.06" stroke-dasharray="3 3">
          <line x1="24" y1="110" x2="690" y2="110"/>
          <line x1="24" y1="180" x2="690" y2="180"/>
          <line x1="24" y1="250" x2="690" y2="250"/>
        </g>

        <!-- Area Curve -->
        <path d="M 24 280 Q 120 250, 200 230 T 380 180 T 520 120 T 690 90 L 690 300 L 24 300 Z" fill="url(#chartGrad)"/>
        <!-- Crimson Chart Line -->
        <path d="M 24 280 Q 120 250, 200 230 T 380 180 T 520 120 T 690 90" fill="none" stroke="#8B0D1A" stroke-width="3"/>

        <!-- Active Data Nodes -->
        <circle cx="380" cy="180" r="5" fill="#8B0D1A" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="520" cy="120" r="5" fill="#8B0D1A" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="690" cy="90" r="6" fill="#8B0D1A" stroke="#F5F2ED" stroke-width="2"/>

        <!-- Tooltip -->
        <rect x="470" y="60" width="105" height="36" rx="6" fill="#0B0B0B" stroke="#8B0D1A" stroke-width="1"/>
        <text x="480" y="78" fill="#F5F2ED" font-family="monospace" font-size="10">SCALE: +380%</text>
        <text x="480" y="90" fill="#77716E" font-family="monospace" font-size="8">OPTIMAL BUILD</text>
      </g>
    </g>
  </g>
</svg>
