<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="customBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#140F11"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B0D1A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B0D1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#customBg)"/>
  <circle cx="600" cy="400" r="380" fill="url(#meshGlow)"/>

  <!-- Abstract Generative Wireframe Nodes Network -->
  <g stroke="#8B0D1A" stroke-opacity="0.4" stroke-width="1.2">
    <!-- Connecting Polygons -->
    <polygon points="600,160 840,280 780,540 600,640 420,540 360,280" fill="none"/>
    <polygon points="600,240 740,320 700,480 600,540 500,480 460,320" fill="none" stroke="#F5F2ED" stroke-opacity="0.15"/>
    <line x1="600" y1="160" x2="600" y2="640" stroke-dasharray="4 4"/>
    <line x1="360" y1="280" x2="840" y2="280"/>
    <line x1="420" y1="540" x2="780" y2="540"/>
    <line x1="600" y1="160" x2="600" y2="240"/>
    <line x1="840" y1="280" x2="740" y2="320"/>
    <line x1="780" y1="540" x2="700" y2="480"/>
    <line x1="600" y1="640" x2="600" y2="540"/>
    <line x1="420" y1="540" x2="500" y2="480"/>
    <line x1="360" y1="280" x2="460" y2="320"/>
  </g>

  <!-- Glowing Nodes with Crimson Accents -->
  <circle cx="600" cy="160" r="7" fill="#8B0D1A" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="840" cy="280" r="7" fill="#8B0D1A" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="780" cy="540" r="7" fill="#8B0D1A" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="600" cy="640" r="7" fill="#8B0D1A" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="420" cy="540" r="7" fill="#8B0D1A" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="360" cy="280" r="7" fill="#8B0D1A" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Center Core Node -->
  <circle cx="600" cy="400" r="48" fill="#141112" stroke="#8B0D1A" stroke-width="3"/>
  <circle cx="600" cy="400" r="32" fill="#8B0D1A"/>
  <text x="600" y="405" text-anchor="middle" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="16">D</text>

  <!-- Top Floating Telemetry Card -->
  <g transform="translate(425, 70)">
    <rect width="350" height="46" rx="23" fill="#141112" stroke="#8B0D1A" stroke-width="1.5"/>
    <circle cx="450" cy="93" r="4" fill="#8B0D1A"/>
    <text x="465" y="97" fill="#F5F2ED" font-family="monospace" font-size="11" letter-spacing="2">BESPOKE MULTI-DISCIPLINARY LAB</text>
  </g>

  <!-- Bottom Statement Card -->
  <g transform="translate(360, 680)">
    <rect width="480" height="54" rx="12" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.1"/>
    <text x="240" y="32" text-anchor="middle" fill="#D8D3CD" font-family="'Instrument Serif', serif" font-style="italic" font-size="20">
      Have a vision outside standard categories? We build it.
    </text>
  </g>
</svg>
