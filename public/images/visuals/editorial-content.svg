<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="edBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="50%" stop-color="#141112"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="edCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1516"/>
      <stop offset="100%" stop-color="#110E0F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#edBg)"/>

  <!-- Editorial Column Lines -->
  <g stroke="#F5F2ED" stroke-opacity="0.05" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="800"/>
    <line x1="420" y1="0" x2="420" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
  </g>

  <!-- Large Editorial Magazine Layout Spread -->
  <g transform="translate(120, 110)">
    <rect width="960" height="580" rx="18" fill="url(#edCard)" stroke="#F5F2ED" stroke-opacity="0.08" stroke-width="1"/>
    
    <!-- Top Editorial Masthead -->
    <g transform="translate(50, 50)">
      <text x="0" y="0" fill="#77716E" font-family="monospace" font-size="11" letter-spacing="4">DIGIT STUDIO · CONTENT CREATION</text>
      <text x="860" y="0" text-anchor="end" fill="#8B0D1A" font-family="monospace" font-size="11">ISSUE 04 · STORYTELLING</text>
      <line x1="0" y1="20" x2="860" y2="20" stroke="#F5F2ED" stroke-opacity="0.08" stroke-width="1"/>
    </g>

    <!-- Two-Column Editorial Spread -->
    <g transform="translate(50, 100)">
      <!-- Left Column: Big Drop Cap & Typographic Article -->
      <g transform="translate(0, 0)">
        <text x="0" y="70" fill="#8B0D1A" font-family="'Instrument Serif', serif" font-style="italic" font-size="96" font-weight="400">D</text>
        <text x="75" y="32" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="26">istinctive stories cut</text>
        <text x="75" y="62" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="26">through the digital noise.</text>

        <text x="0" y="115" fill="#D8D3CD" font-family="'Instrument Serif', serif" font-style="italic" font-size="19" width="380">
          "Content is not simply about posting more often; it is about saying something memorable."
        </text>

        <text x="0" y="160" fill="#77716E" font-family="'Manrope', sans-serif" font-size="13" line-height="1.6">
          We script, storyboard, produce and edit brand-led educational and promotional assets that inform, persuade and build loyalty with an audience that values substance.
        </text>

        <!-- Chapter Index Pills -->
        <g transform="translate(0, 240)">
          <rect x="0" y="0" width="170" height="36" rx="18" fill="#141112" stroke="#8B0D1A" stroke-width="1"/>
          <text x="20" y="22" fill="#F5F2ED" font-family="monospace" font-size="11">01 · SCRIPT &amp; VOICE</text>

          <rect x="185" y="0" width="185" height="36" rx="18" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.1"/>
          <text x="205" y="22" fill="#D8D3CD" font-family="monospace" font-size="11">02 · VIDEO &amp; MOTION</text>
        </g>
      </g>

      <!-- Right Column: Video Production Storyboard Grid -->
      <g transform="translate(460, 0)">
        <text x="0" y="0" fill="#77716E" font-family="monospace" font-size="11" letter-spacing="2">STORYBOARD FLOW</text>
        
        <!-- Storyboard Frame 1 -->
        <g transform="translate(0, 20)">
          <rect width="185" height="110" rx="10" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.12"/>
          <circle cx="92" cy="55" r="18" fill="#8B0D1A" fill-opacity="0.8"/>
          <polygon points="88,48 100,55 88,62" fill="#FFFFFF"/>
          <text x="12" y="100" fill="#77716E" font-family="monospace" font-size="9">SCENE 01 · THE HOOK</text>
        </g>

        <!-- Storyboard Frame 2 -->
        <g transform="translate(205, 20)">
          <rect width="185" height="110" rx="10" fill="#141112" stroke="#8B0D1A" stroke-width="1.5"/>
          <circle cx="92" cy="55" r="18" fill="#8B0D1A"/>
          <polygon points="88,48 100,55 88,62" fill="#FFFFFF"/>
          <text x="12" y="100" fill="#8B0D1A" font-family="monospace" font-size="9">SCENE 02 · CORE VALUE</text>
        </g>

        <!-- Storyboard Frame 3 -->
        <g transform="translate(0, 150)">
          <rect width="185" height="110" rx="10" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.12"/>
          <circle cx="92" cy="55" r="18" fill="#8B0D1A" fill-opacity="0.8"/>
          <polygon points="88,48 100,55 88,62" fill="#FFFFFF"/>
          <text x="12" y="100" fill="#77716E" font-family="monospace" font-size="9">SCENE 03 · PROOF</text>
        </g>

        <!-- Storyboard Frame 4 -->
        <g transform="translate(205, 150)">
          <rect width="185" height="110" rx="10" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.12"/>
          <circle cx="92" cy="55" r="18" fill="#8B0D1A" fill-opacity="0.8"/>
          <polygon points="88,48 100,55 88,62" fill="#FFFFFF"/>
          <text x="12" y="100" fill="#77716E" font-family="monospace" font-size="9">SCENE 04 · ACTION</text>
        </g>

        <!-- Format delivery badge -->
        <rect x="0" y="285" width="390" height="38" rx="8" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.08"/>
        <text x="195" y="309" text-anchor="middle" fill="#D8D3CD" font-family="monospace" font-size="10" letter-spacing="1">MULTI-RATIO EXPORT: 16:9 · 9:16 · 1:1 READY</text>
      </g>
    </g>
  </g>
</svg>
