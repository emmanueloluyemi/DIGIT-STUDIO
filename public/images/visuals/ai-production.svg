<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#140A0D"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="lensFlare" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8B0D1A" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8B0D1A" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FF4D5E" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#8B0D1A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B0D1A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5D6C"/>
      <stop offset="30%" stop-color="#8B0D1A"/>
      <stop offset="70%" stop-color="#2B0509"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#aiBg)"/>

  <!-- Viewfinder Framing Lines -->
  <g stroke="#F5F2ED" stroke-opacity="0.12" stroke-width="1.5">
    <!-- Top Left -->
    <path d="M 80 120 L 80 80 L 120 80" fill="none"/>
    <!-- Top Right -->
    <path d="M 1080 80 L 1120 80 L 1120 120" fill="none"/>
    <!-- Bottom Left -->
    <path d="M 80 680 L 80 720 L 120 720" fill="none"/>
    <!-- Bottom Right -->
    <path d="M 1080 720 L 1120 720 L 1120 680" fill="none"/>
  </g>

  <!-- Camera HUD Telemetry -->
  <g font-family="monospace" font-size="11" letter-spacing="2">
    <circle cx="105" cy="115" r="5" fill="#8B0D1A"/>
    <text x="120" y="119" fill="#F5F2ED">REC · 4K HDR</text>
    <text x="120" y="137" fill="#77716E">24.00 FPS · 1/48s</text>

    <text x="600" y="119" text-anchor="middle" fill="#D8D3CD">AI GENERATIVE VIDEO PRODUCTION · DIGIT STUDIO</text>
    
    <text x="1075" y="119" text-anchor="end" fill="#F5F2ED">TC 00:14:28:12</text>
    <text x="1075" y="137" text-anchor="end" fill="#8B0D1A">NEURAL RENDER ACTIVE</text>
  </g>

  <!-- Central 3D Volumetric Sphere with Raytrace Wireframe Orbitals -->
  <g transform="translate(600, 390)">
    <!-- Deep Anamorphic Flare Beam -->
    <rect x="-560" y="-1" width="1120" height="2" fill="url(#lensFlare)"/>
    <ellipse cx="0" cy="0" rx="280" ry="12" fill="url(#lensFlare)" opacity="0.4"/>

    <!-- Orbital Wireframe Rings -->
    <ellipse cx="0" cy="0" rx="240" ry="95" fill="none" stroke="#F5F2ED" stroke-opacity="0.12" stroke-width="1" transform="rotate(-20)"/>
    <ellipse cx="0" cy="0" rx="240" ry="95" fill="none" stroke="#8B0D1A" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="8 6" transform="rotate(35)"/>

    <!-- 3D Core Sphere -->
    <circle cx="0" cy="0" r="130" fill="url(#sphereGrad)"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#F5F2ED" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Geometric Facet Reflections -->
    <path d="M-60 -40 L40 -70 L90 10 L20 70 L-70 40 Z" fill="none" stroke="#F5F2ED" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="-35" cy="-35" r="4" fill="#FFFFFF"/>
    
    <!-- Horizon Crosshair -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#F5F2ED" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#F5F2ED" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Bottom Timeline & Audio Sequencer Bar -->
  <g transform="translate(100, 640)">
    <rect width="1000" height="64" rx="10" fill="#141112" stroke="#F5F2ED" stroke-opacity="0.08"/>
    
    <!-- Playhead Needle -->
    <line x1="420" y1="0" x2="420" y2="64" stroke="#8B0D1A" stroke-width="2"/>
    <polygon points="415,0 425,0 420,8" fill="#8B0D1A"/>

    <!-- Track Waveform Stems -->
    <g fill="#8B0D1A" opacity="0.6">
      <rect x="40" y="22" width="3" height="20" rx="1"/>
      <rect x="48" y="16" width="3" height="32" rx="1"/>
      <rect x="56" y="26" width="3" height="12" rx="1"/>
      <rect x="64" y="12" width="3" height="40" rx="1"/>
      <rect x="72" y="18" width="3" height="28" rx="1"/>
      <rect x="80" y="24" width="3" height="16" rx="1"/>
      <rect x="88" y="10" width="3" height="44" rx="1"/>
      <rect x="96" y="20" width="3" height="24" rx="1"/>
      <rect x="104" y="14" width="3" height="36" rx="1"/>
      <rect x="112" y="22" width="3" height="20" rx="1"/>
    </g>

    <!-- Keyframe Markers -->
    <circle cx="210" cy="32" r="5" fill="#8B0D1A"/>
    <circle cx="420" cy="32" r="5" fill="#F5F2ED"/>
    <circle cx="680" cy="32" r="5" fill="#8B0D1A"/>
    <circle cx="890" cy="32" r="5" fill="#8B0D1A"/>

    <text x="500" y="38" fill="#77716E" font-family="monospace" font-size="11" letter-spacing="2">KEYFRAME SEQUENCE: 3D MOTION + VOICE + GRADE</text>
  </g>
</svg>
