<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="50%" stop-color="#141112"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A31222"/>
      <stop offset="100%" stop-color="#8B0D1A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1A1B"/>
      <stop offset="100%" stop-color="#141112"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8B0D1A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B0D1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Architectural Grid Lines -->
  <g stroke="#F5F2ED" stroke-opacity="0.05" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
  </g>

  <!-- Main Identity Presentation Card -->
  <g transform="translate(120, 140)">
    <rect width="520" height="520" rx="20" fill="url(#cardGrad)" stroke="#F5F2ED" stroke-opacity="0.08" stroke-width="1"/>
    
    <!-- Header telemetry -->
    <text x="40" y="55" fill="#77716E" font-family="monospace" font-size="12" letter-spacing="3">DIGIT STUDIO · BRAND IDENTITY SYSTEM</text>
    <circle cx="475" cy="50" r="4" fill="#8B0D1A"/>
    <line x1="40" y1="75" x2="480" y2="75" stroke="#F5F2ED" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Large Monogram Specimen -->
    <g transform="translate(40, 110)">
      <rect width="110" height="110" rx="16" fill="#8B0D1A"/>
      <!-- D letter cut -->
      <path d="M32 24 h24 c18 0 30 11 30 31 s-12 31 -30 31 H32 V24 z m16 14 v34 h6 c9 0 14 -5 14 -17 s-5 -17 -14 -17 h-6 z" fill="#F5F2ED"/>
      <rect x="76" y="16" width="10" height="10" fill="#F5F2ED"/>
    </g>

    <!-- Typographic Specimen -->
    <text x="175" y="150" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="34" letter-spacing="-1">DIGIT STUDIO</text>
    <text x="175" y="185" fill="#D8D3CD" font-family="'Instrument Serif', serif" font-style="italic" font-size="22">Visual Identity &amp; System</text>
    <text x="175" y="215" fill="#77716E" font-family="sans-serif" font-size="13">Scale · Proportion · Grid Hierarchy</text>

    <!-- Color Swatches -->
    <g transform="translate(40, 260)">
      <text x="0" y="0" fill="#77716E" font-family="monospace" font-size="11" letter-spacing="2">CORE BRAND PALETTE</text>
      
      <rect x="0" y="16" width="95" height="48" rx="8" fill="#0B0B0B" stroke="#F5F2ED" stroke-opacity="0.15"/>
      <text x="10" y="50" fill="#77716E" font-family="monospace" font-size="10">#0B0B0B</text>

      <rect x="110" y="16" width="95" height="48" rx="8" fill="#8B0D1A"/>
      <text x="120" y="50" fill="#FFFFFF" font-family="monospace" font-size="10">#8B0D1A</text>

      <rect x="220" y="16" width="95" height="48" rx="8" fill="#F5F2ED"/>
      <text x="230" y="50" fill="#0B0B0B" font-family="monospace" font-size="10">#F5F2ED</text>

      <rect x="330" y="16" width="95" height="48" rx="8" fill="#252525"/>
      <text x="340" y="50" fill="#D8D3CD" font-family="monospace" font-size="10">#252525</text>
    </g>

    <!-- Typography Scale Preview -->
    <g transform="translate(40, 370)">
      <line x1="0" y1="0" x2="440" y2="0" stroke="#F5F2ED" stroke-opacity="0.08" stroke-width="1"/>
      <text x="0" y="32" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="22">Aa Bb Gg 123</text>
      <text x="240" y="32" fill="#D8D3CD" font-family="'Instrument Serif', serif" font-style="italic" font-size="24">The quick brown fox</text>
      <text x="0" y="70" fill="#77716E" font-family="'Manrope', sans-serif" font-size="13">Carefully crafted typography systems that command attention and communicate credibility.</text>
    </g>
  </g>

  <!-- Secondary Layered Stationery / Packaging Mockup Card -->
  <g transform="translate(680, 180)">
    <!-- Shadow Card -->
    <rect x="20" y="20" width="400" height="460" rx="16" fill="#050505" opacity="0.6"/>
    <!-- Main Floating Specimen -->
    <rect width="400" height="460" rx="16" fill="#171717" stroke="#8B0D1A" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Embossed Brand Emblem in Center -->
    <circle cx="200" cy="180" r="70" fill="#141112" stroke="#8B0D1A" stroke-width="2"/>
    <circle cx="200" cy="180" r="54" fill="none" stroke="#F5F2ED" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M185 155 h18 c14 0 24 8 24 25 s-10 25 -24 25 H185 V155 z m12 11 v28 h4 c7 0 11 -4 11 -14 s-4 -14 -11 -14 h-4 z" fill="#8B0D1A"/>
    <rect x="216" y="148" width="7" height="7" fill="#8B0D1A"/>

    <text x="200" y="290" text-anchor="middle" fill="#F5F2ED" font-family="'Syne', sans-serif" font-weight="700" font-size="18" letter-spacing="4">DIGIT STUDIO</text>
    <text x="200" y="315" text-anchor="middle" fill="#77716E" font-family="monospace" font-size="11" letter-spacing="3">EDITORIAL &amp; LUXURY PACKAGING</text>
    
    <!-- Red Accent Corner Ribbon -->
    <polygon points="350,0 400,0 400,50" fill="#8B0D1A"/>
    
    <!-- Bottom Foil Badge -->
    <rect x="60" y="370" width="280" height="42" rx="21" fill="#1F1A1B" stroke="#F5F2ED" stroke-opacity="0.1"/>
    <text x="200" y="396" text-anchor="middle" fill="#D8D3CD" font-family="monospace" font-size="11" letter-spacing="2">BESPOKE BRANDING COLLATERAL</text>
  </g>
</svg>
